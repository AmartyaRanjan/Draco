[build-system]
requires = ["setuptools>=77"]  # 77+ for the SPDX `license` expression and `license-files`
build-backend = "setuptools.build_meta"

[project]
name = "draco"
version = "0.1.0"
description = "Embeddable agent runtime: harness, routing, tools, security, state and observability, with optional adapters"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amartya Ranjan" }]
keywords = ["rag", "agents", "llm", "harness", "orchestration", "retrieval", "langgraph", "tool-use", "multi-tenant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# The native framework (core, harness, agents, routing, tools, security, state, observability) needs only
# pydantic. Everything else is an optional extra; adapters for the starter RAG app (`app`) need its own
# stack (requirements.txt) and are never imported by the core.
dependencies = ["pydantic>=2.6"]

[project.urls]
Homepage = "https://github.com/AmartyaRanjan/Draco"
Documentation = "https://github.com/AmartyaRanjan/Draco/blob/main/docs/README.md"
Source = "https://github.com/AmartyaRanjan/Draco"
Issues = "https://github.com/AmartyaRanjan/Draco/issues"
Changelog = "https://github.com/AmartyaRanjan/Draco/blob/main/docs/DRACO_CHANGELOG.md"
"Security Policy" = "https://github.com/AmartyaRanjan/Draco/blob/main/SECURITY.md"

[project.optional-dependencies]
agents = ["langgraph>=1.0", "langchain-core", "langgraph-checkpoint-sqlite>=2.0"]  # draco.adapters.langgraph
providers = ["httpx>=0.27"]                      # draco.adapters.providers (OpenAI-compatible, Anthropic)
app = ["httpx>=0.27"]                            # adapters for the bundled starter app (plus requirements.txt)
mcp = ["mcp>=1.0"]
postgres = ["psycopg[binary]>=3.1"]               # draco.state.postgres.PostgresStore
crypto = ["cryptography>=42"]                    # draco.security.crypto.FernetCipher (encryption at rest)
otel = ["opentelemetry-api", "opentelemetry-sdk"]
dev = ["pytest>=8", "ruff", "mypy", "pip-audit"]

[tool.setuptools.packages.find]
# Only the framework is packaged. `app` (the starter RAG service) is deployed from source (see the Dockerfile).
where = ["src"]
include = ["draco*"]

[tool.setuptools.exclude-package-data]
app = ["storage/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]  # re-export modules
"tests/**" = ["E701", "E702", "E731"]
"examples/**" = ["E701", "E702", "E731"]

[tool.mypy]
python_version = "3.11"
files = ["src/draco"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# the existing app engine is type-checked only where Draco calls it; its own errors are out of scope here
module = "app.*"
follow_imports = "silent"
