[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "draco"
version = "0.1.0"
description = "Embeddable agent runtime: harness, routing, tools, security, state and observability, with optional adapters"
readme = "README.md"
requires-python = ">=3.11"
# The native framework (core, harness, agents, routing, tools, security, state, observability) needs only
# pydantic. Everything else is an optional extra; adapters for the starter RAG app (`app`) need its own
# stack (requirements.txt) and are never imported by the core.
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
agents = ["langgraph>=1.0", "langchain-core"]   # draco.adapters.langgraph
app = ["httpx>=0.27"]                            # adapters for the bundled starter app (plus requirements.txt)
mcp = ["mcp>=1.0"]
otel = ["opentelemetry-api", "opentelemetry-sdk"]
dev = ["pytest>=8", "ruff", "mypy", "pip-audit"]

[tool.setuptools.packages.find]
# `app` is the existing RAG engine and ships alongside `draco` for now (see docs/architecture).
where = ["src", "."]
include = ["draco*", "app*"]

[tool.setuptools.exclude-package-data]
app = ["storage/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]  # re-export modules
"tests/**" = ["E701", "E702", "E731"]
"examples/**" = ["E701", "E702", "E731"]

[tool.mypy]
python_version = "3.11"
files = ["src/draco"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# the existing app engine is type-checked only where Draco calls it; its own errors are out of scope here
module = "app.*"
follow_imports = "silent"
