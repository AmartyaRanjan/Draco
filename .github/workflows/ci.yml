name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    # The whole framework suite with every optional extra installed (LangGraph, providers, crypto, MCP, OTel, Postgres).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.14"}
      - name: Install draco with all extras
        run: pip install -e ".[dev,agents,providers,crypto,mcp,otel,postgres]"
      - name: Draco tests (unit, integration, reliability, examples, deterministic evals)
        run: python -m pytest tests/draco -q
      - name: Deterministic control-plane evals
        run: python -m tests.draco.eval.runner

  draco-core:
    # Proves the framework installs and runs without torch/qdrant/langgraph: only pydantic + httpx.
    # pyproject declares requires-python >=3.11, so the lowest supported versions are tested too.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    name: draco-core (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python-version }}"}
      - name: Install draco with dev tools only
        run: |
          # setuptools is upgraded too: the 3.11 runner image bundles one with known vulnerabilities, and the
          # dependency audit below scans the whole environment.
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -e ".[dev,providers]"
      - name: Reject tracked runtime data
        run: |
          if git ls-files | grep -E '(^|/)(app/storage|uploads|artifacts|eval_results|documents)(/|$)|(^|/)(\.env|.*\.db)$|\.(pdf|docx|pptx|ipynb)$'; then
            echo "Runtime data, documents or environment files must not be tracked"
            exit 1
          fi
      - name: Lint and types
        run: |
          ruff check src tests/draco examples
          mypy src/draco
      - name: Framework tests that need no ML stack
        run: python -m pytest tests/draco/unit tests/draco/reliability -q
      - name: Built wheel imports without app code or heavy deps (non-editable install, run from another directory)
        run: |
          python -m pip wheel . --no-deps -w /tmp/wheel
          python -m venv /tmp/clean && /tmp/clean/bin/pip install /tmp/wheel/draco_harness-*.whl
          cd /tmp && /tmp/clean/bin/python -I -c "import sys, draco, draco.tools, draco.security, draco.adapters.retrieval; assert not {'app','torch','langgraph'} & set(sys.modules)"
      - name: Dependency audit (framework deps)
        run: |
          python -m pip uninstall --yes draco-harness
          pip-audit --skip-editable --strict --desc
