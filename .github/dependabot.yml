version: 2
updates:
  # pyproject.toml. Draco is a library: its lower bounds say which versions it supports, so they move only
  # when Draco needs a newer feature or fix. `increase-if-necessary` keeps Dependabot from raising them.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
